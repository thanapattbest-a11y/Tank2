<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR Tank - Hiro Marker</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        /* -------------------------------
           UI
        -------------------------------- */

        #ui {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 20px;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;

            pointer-events: none;
        }

        #status {
            color: white;
            background: rgba(0,0,0,0.65);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            pointer-events: none;
        }

        #controls {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.4);

            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.92);
        }

        #fireButton {
            background: #c62828;
            min-width: 150px;
        }

        #reloadButton {
            background: #2e7d32;
            min-width: 150px;
        }

        #ammo {
            color: #fff;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            padding: 8px 15px;
            font-size: 18px;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;
            font-size: 20px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {

            #controls {
                width: 95%;
            }

            button {
                flex: 1;
                padding: 14px 8px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Loading -->
    <div id="loading">
        กำลังเปิดกล้อง AR...
    </div>

    <!-- ===============================
         AR SCENE
    ================================== -->

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Camera -->
        <a-entity camera></a-entity>

        <!-- Hiro Marker -->
        <a-marker
            id="hiroMarker"
            preset="hiro"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">

            <!-- =========================
                 TANK
            ========================== -->

            <a-entity id="tank" position="0 0 0">

                <!-- ตัวรถถัง -->
                <a-box
                    position="0 0.35 0"
                    width="1.7"
                    height="0.55"
                    depth="2.2"
                    color="#4b5320"
                    shadow>
                </a-box>

                <!-- เกราะด้านหน้า -->
                <a-box
                    position="0 0.48 -1.05"
                    width="1.65"
                    height="0.45"
                    depth="0.20"
                    rotation="15 0 0"
                    color="#59652a">
                </a-box>

                <!-- เกราะด้านข้าง -->
                <a-box
                    position="-0.9 0.38 0"
                    width="0.20"
                    height="0.45"
                    depth="1.9"
                    color="#3d4519">
                </a-box>

                <a-box
                    position="0.9 0.38 0"
                    width="0.20"
                    height="0.45"
                    depth="1.9"
                    color="#3d4519">
                </a-box>

                <!-- ล้อซ้าย -->
                <a-cylinder
                    position="-0.92 0.15 0.65"
                    radius="0.30"
                    height="0.20"
                    rotation="0 0 90"
                    color="#181818">
                </a-cylinder>

                <a-cylinder
                    position="-0.92 0.15 -0.65"
                    radius="0.30"
                    height="0.20"
                    rotation="0 0 90"
                    color="#181818">
                </a-cylinder>

                <!-- ล้อขวา -->
                <a-cylinder
                    position="0.92 0.15 0.65"
                    radius="0.30"
                    height="0.20"
                    rotation="0 0 90"
                    color="#181818">
                </a-cylinder>

                <a-cylinder
                    position="0.92 0.15 -0.65"
                    radius="0.30"
                    height="0.20"
                    rotation="0 0 90"
                    color="#181818">
                </a-cylinder>

                <!-- Track ซ้าย -->
                <a-box
                    position="-0.92 0.15 0"
                    width="0.25"
                    height="0.65"
                    depth="2"
                    color="#222222">
                </a-box>

                <!-- Track ขวา -->
                <a-box
                    position="0.92 0.15 0"
                    width="0.25"
                    height="0.65"
                    depth="2"
                    color="#222222">
                </a-box>

                <!-- ======================
                     ป้อมปืน
                ======================= -->

                <a-entity id="turret"
                          position="0 0.75 0">

                    <!-- ฐานป้อม -->
                    <a-cylinder
                        radius="0.60"
                        height="0.25"
                        color="#4b5320">
                    </a-cylinder>

                    <!-- เกราะป้อม -->
                    <a-box
                        position="0 0.22 0"
                        width="0.95"
                        height="0.45"
                        depth="0.95"
                        color="#566324">
                    </a-box>

                    <!-- ลำกล้อง -->
                    <a-cylinder
                        id="barrel"
                        position="0 0.25 -0.85"
                        radius="0.11"
                        height="1.7"
                        rotation="90 0 0"
                        color="#202020">
                    </a-cylinder>

                    <!-- ปากกระบอก -->
                    <a-cylinder
                        position="0 0.25 -1.70"
                        radius="0.16"
                        height="0.25"
                        rotation="90 0 0"
                        color="#111111">
                    </a-cylinder>

                    <!-- ปืนกลด้านบน -->
                    <a-cylinder
                        position="0 0.60 -0.15"
                        radius="0.045"
                        height="0.8"
                        rotation="90 0 0"
                        color="#111111">
                    </a-cylinder>

                </a-entity>

                <!-- ไฟด้านหน้า -->
                <a-sphere
                    position="-0.55 0.50 -1.17"
                    radius="0.10"
                    color="#ffffaa"
                    emissive="#ffff00">
                </a-sphere>

                <a-sphere
                    position="0.55 0.50 -1.17"
                    radius="0.10"
                    color="#ffffaa"
                    emissive="#ffff00">
                </a-sphere>

            </a-entity>

        </a-marker>

    </a-scene>


    <!-- ===============================
         GAME UI
    ================================== -->

    <div id="ui">

        <div id="status">
            🔍 กำลังค้นหา Hiro Marker...
        </div>

        <div id="ammo">
            กระสุน: <span id="ammoCount">3</span>
        </div>

        <div id="controls">

            <button id="fireButton">
                💥 ยิงปืนใหญ่
            </button>

            <button id="reloadButton">
                🔋 ใส่กระสุน
            </button>

        </div>

    </div>


<script>

    /* =====================================================
       AR TANK GAME
    ===================================================== */

    let ammo = 3;
    const MAX_AMMO = 3;

    const marker = document.getElementById("hiroMarker");
    const tank = document.getElementById("tank");
    const turret = document.getElementById("turret");

    const fireButton = document.getElementById("fireButton");
    const reloadButton = document.getElementById("reloadButton");

    const ammoText = document.getElementById("ammoCount");
    const statusText = document.getElementById("status");
    const loading = document.getElementById("loading");


    /* ---------------------------------------------
       Loading
    --------------------------------------------- */

    window.addEventListener("load", () => {

        setTimeout(() => {
            loading.classList.add("hidden");
        }, 2000);

    });


    /* ---------------------------------------------
       Hiro Marker Found
    --------------------------------------------- */

    marker.addEventListener("markerFound", () => {

        statusText.innerHTML =
            "🪖 พบ Hiro Marker — รถถังพร้อมรบ!";

        statusText.style.background =
            "rgba(30,100,30,0.85)";

    });


    /* ---------------------------------------------
       Hiro Marker Lost
    --------------------------------------------- */

    marker.addEventListener("markerLost", () => {

        statusText.innerHTML =
            "🔍 ไม่พบ Hiro Marker";

        statusText.style.background =
            "rgba(0,0,0,0.65)";

    });


    /* ---------------------------------------------
       Update Ammo
    --------------------------------------------- */

    function updateAmmo() {

        ammoText.innerText = ammo;

        if (ammo <= 0) {

            fireButton.style.opacity = "0.5";

        } else {

            fireButton.style.opacity = "1";

        }

    }


    /* ---------------------------------------------
       FIRE
    --------------------------------------------- */

    fireButton.addEventListener("click", () => {

        if (ammo <= 0) {

            statusText.innerHTML =
                "⚠️ กระสุนหมด! กดใส่กระสุน";

            return;
        }

        ammo--;

        updateAmmo();

        fireCannon();

    });


    /* ---------------------------------------------
       RELOAD
    --------------------------------------------- */

    reloadButton.addEventListener("click", () => {

        if (ammo >= MAX_AMMO) {

            statusText.innerHTML =
                "🔋 กระสุนเต็มแล้ว";

            return;
        }

        reloadButton.disabled = true;

        statusText.innerHTML =
            "🔄 กำลังใส่กระสุน...";

        /*
         * จำลองเวลา Reload
         */
        setTimeout(() => {

            ammo = MAX_AMMO;

            updateAmmo();

            reloadButton.disabled = false;

            statusText.innerHTML =
                "🟢 ใส่กระสุนเรียบร้อย";

        }, 1200);

    });


    /* =====================================================
       FIRE CANNON
    ===================================================== */

    function fireCannon() {

        /*
         * สร้างกระสุนใน Scene
         */

        const scene = document.querySelector("a-scene");

        const bullet = document.createElement("a-sphere");

        bullet.setAttribute("radius", "0.10");

        bullet.setAttribute("color", "#ff6600");

        bullet.setAttribute(
            "emissive",
            "#ff3300"
        );

        /*
         * จุดเริ่มต้นกระสุน
         *
         * เนื่องจากปืนหันไปทาง -Z
         */
        bullet.setAttribute(
            "position",
            "0 1.0 -1.7"
        );

        scene.appendChild(bullet);


        /* -----------------------------------------
           Flash ที่ปากกระบอก
        ----------------------------------------- */

        const flash = document.createElement("a-sphere");

        flash.setAttribute("radius", "0.25");

        flash.setAttribute(
            "material",
            "color: #ffff00; emissive: #ff6600; opacity: 0.9;"
        );

        flash.setAttribute(
            "position",
            "0 1.0 -1.7"
        );

        scene.appendChild(flash);


        /*
         * Animation กระสุน
         */
        bullet.setAttribute(
            "animation",
            `
            property: position;
            to: 0 1.0 -8;
            dur: 900;
            easing: linear
            `
        );


        /*
         * Flash หายไป
         */
        flash.setAttribute(
            "animation",
            `
            property: scale;
            from: 1 1 1;
            to: 0 0 0;
            dur: 150;
            easing: easeOutQuad
            `
        );


        /*
         * ลบกระสุนหลังยิง
         */
        setTimeout(() => {

            if (bullet.parentNode) {
                bullet.parentNode.removeChild(bullet);
            }

        }, 1000);


        /*
         * ลบ Flash
         */
        setTimeout(() => {

            if (flash.parentNode) {
                flash.parentNode.removeChild(flash);
            }

        }, 200);


        /*
         * Animation ป้อมปืนถอยหลัง
         */

        turret.setAttribute(
            "animation__recoil",
            `
            property: position;
            from: 0 0.75 0;
            to: 0 0.75 0.12;
            dur: 70;
            dir: alternate;
            loop: 2;
            easing: easeOutQuad
            `
        );


        statusText.innerHTML =
            "💥 ยิงปืนใหญ่!";


        /*
         * กลับไปแสดงจำนวนกระสุน
         */
        setTimeout(() => {

            if (ammo > 0) {

                statusText.innerHTML =
                    "🪖 รถถังพร้อมยิง";

            } else {

                statusText.innerHTML =
                    "⚠️ กระสุนหมด — กดใส่กระสุน";

            }

        }, 700);

    }


    /* ---------------------------------------------
       Keyboard Controls
       Space = ยิง
       R = Reload
    --------------------------------------------- */

    document.addEventListener("keydown", (event) => {

        if (event.code === "Space") {

            event.preventDefault();

            fireButton.click();

        }

        if (event.code === "KeyR") {

            reloadButton.click();

        }

    });


    updateAmmo();

</script>

</body>
</html>
```
